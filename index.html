<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>運動 消費カロリー計算機（METベース）</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">
  <div class="max-w-xl mx-auto px-4 py-10">
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-white mb-1">運動 消費カロリー計算機</h1>
      <p class="text-gray-400 text-sm">Exercise Calorie Calculator (MET-based)</p>
    </header>

    <!-- Input Section -->
    <div class="bg-gray-800 rounded-xl p-6 mb-6">
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label for="weightInput" class="block text-sm font-medium text-gray-300 mb-1">
            体重 (kg)
          </label>
          <input
            id="weightInput"
            type="number"
            value="60"
            min="1"
            max="300"
            step="0.1"
            aria-label="体重（キログラム）"
            class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2.5 text-white text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
          />
        </div>
        <div>
          <label for="durationInput" class="block text-sm font-medium text-gray-300 mb-1">
            運動時間 (分)
          </label>
          <input
            id="durationInput"
            type="number"
            value="30"
            min="1"
            max="600"
            step="1"
            aria-label="運動時間（分）"
            class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2.5 text-white text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
          />
        </div>
      </div>

      <div class="mb-4">
        <label for="exerciseSelect" class="block text-sm font-medium text-gray-300 mb-1">
          運動の種類
        </label>
        <select
          id="exerciseSelect"
          class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2.5 text-white text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
          aria-label="運動の種類を選択"
        >
        </select>
      </div>

      <!-- MET display -->
      <div class="bg-gray-700/50 rounded-lg px-3 py-2 mb-4 text-xs text-gray-400 flex justify-between">
        <span>MET値（代謝当量）:</span>
        <span id="metDisplay" class="font-mono font-semibold text-orange-400">—</span>
      </div>

      <div id="calcError" class="hidden text-red-400 text-xs mb-2" role="alert" aria-live="polite"></div>

      <button
        id="calcBtn"
        class="w-full bg-orange-600 hover:bg-orange-500 text-white font-semibold py-2.5 px-6 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-orange-400"
      >
        計算する
      </button>
    </div>

    <!-- Result Section -->
    <div id="resultSection" class="hidden bg-gray-800 rounded-xl p-6 mb-6 text-center">
      <p class="text-sm text-gray-400 mb-2">消費カロリー</p>
      <div id="kcalDisplay" class="text-5xl font-bold text-orange-400 mb-1"></div>
      <p class="text-sm text-gray-400 mb-4">kcal</p>

      <div class="bg-gray-700/50 rounded-lg px-4 py-3 inline-block">
        <p class="text-xs text-gray-400 mb-1">ご飯に換算すると約</p>
        <div class="flex items-baseline justify-center gap-1">
          <span id="riceDisplay" class="text-2xl font-bold text-yellow-400"></span>
          <span class="text-sm text-gray-300">杯分（1杯 = 200 kcal）</span>
        </div>
      </div>

      <div class="mt-4 grid grid-cols-3 gap-3 text-xs text-gray-400">
        <div class="bg-gray-700/50 rounded-lg p-2">
          <div id="detWeight" class="text-white font-semibold"></div>
          <div>体重</div>
        </div>
        <div class="bg-gray-700/50 rounded-lg p-2">
          <div id="detDuration" class="text-white font-semibold"></div>
          <div>時間</div>
        </div>
        <div class="bg-gray-700/50 rounded-lg p-2">
          <div id="detMET" class="text-white font-semibold"></div>
          <div>MET</div>
        </div>
      </div>
    </div>

    <!-- History Section -->
    <div id="historySection" class="hidden bg-gray-800 rounded-xl p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wide">履歴（直近5件）</h2>
        <button
          id="clearHistoryBtn"
          class="text-xs text-gray-500 hover:text-red-400 transition-colors focus:outline-none focus:ring-2 focus:ring-red-500 rounded px-2 py-1"
          aria-label="履歴をクリア"
        >
          クリア
        </button>
      </div>
      <ul id="historyList" class="space-y-2" aria-label="計算履歴"></ul>
    </div>
  </div>

  <script>
    const EXERCISES = [
      { name: 'ウォーキング', met: 3.5 },
      { name: 'ジョギング', met: 7.0 },
      { name: '水泳', met: 8.0 },
      { name: 'サイクリング', met: 6.0 },
      { name: 'ヨガ', met: 2.5 },
      { name: '筋トレ', met: 5.0 },
      { name: 'テニス', met: 7.3 },
      { name: 'バスケ', met: 8.0 },
      { name: 'サッカー', met: 7.0 },
      { name: '階段昇り', met: 4.0 },
      { name: 'ダンス', met: 5.0 },
      { name: '縄跳び', met: 10.0 },
      { name: 'ゴルフ', met: 4.5 },
      { name: 'バドミントン', met: 5.5 },
      { name: '卓球', met: 4.0 },
      { name: 'ボクシング', met: 9.0 },
      { name: '柔道', met: 10.0 },
      { name: 'スキー', met: 7.0 },
      { name: 'ハイキング', met: 5.3 },
      { name: '掃除', met: 3.0 },
    ];

    const STORAGE_KEY = 'calories-met-history-v1';
    const MAX_HISTORY = 5;
    let history = [];

    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) history = JSON.parse(raw);
      } catch (e) { history = []; }
    }

    function saveHistory() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, MAX_HISTORY)));
    }

    // Populate exercise select
    const sel = document.getElementById('exerciseSelect');
    EXERCISES.forEach((ex, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = ex.name + '（MET: ' + ex.met + '）';
      sel.appendChild(opt);
    });

    sel.addEventListener('change', () => {
      const idx = parseInt(sel.value, 10);
      document.getElementById('metDisplay').textContent = EXERCISES[idx].met;
    });
    // Initial MET display
    document.getElementById('metDisplay').textContent = EXERCISES[0].met;

    document.getElementById('calcBtn').addEventListener('click', calculate);

    function calculate() {
      const weight = parseFloat(document.getElementById('weightInput').value);
      const duration = parseFloat(document.getElementById('durationInput').value);
      const exIdx = parseInt(document.getElementById('exerciseSelect').value, 10);
      const errEl = document.getElementById('calcError');

      if (isNaN(weight) || weight <= 0 || weight > 300) {
        errEl.textContent = '体重は1〜300の範囲で入力してください。';
        errEl.classList.remove('hidden');
        return;
      }
      if (isNaN(duration) || duration <= 0 || duration > 600) {
        errEl.textContent = '運動時間は1〜600分の範囲で入力してください。';
        errEl.classList.remove('hidden');
        return;
      }
      errEl.classList.add('hidden');

      const ex = EXERCISES[exIdx];
      const durationH = duration / 60;
      const kcal = ex.met * weight * durationH * 1.05;
      const kcalRounded = Math.round(kcal * 10) / 10;
      const rice = kcalRounded / 200;

      // Show result
      document.getElementById('kcalDisplay').textContent = kcalRounded.toLocaleString(undefined, { maximumFractionDigits: 1 });
      document.getElementById('riceDisplay').textContent = rice.toFixed(1);
      document.getElementById('detWeight').textContent = weight + 'kg';
      document.getElementById('detDuration').textContent = duration + '分';
      document.getElementById('detMET').textContent = ex.met;
      document.getElementById('resultSection').classList.remove('hidden');

      // Save to history
      const now = new Date();
      const dateStr = now.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      history.unshift({
        date: dateStr,
        exercise: ex.name,
        weight,
        duration,
        kcal: kcalRounded,
        met: ex.met,
      });
      if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
      saveHistory();
      renderHistory();
    }

    function renderHistory() {
      const section = document.getElementById('historySection');
      const ul = document.getElementById('historyList');
      ul.innerHTML = '';

      if (history.length === 0) {
        section.classList.add('hidden');
        return;
      }
      section.classList.remove('hidden');

      history.forEach(entry => {
        const li = document.createElement('li');
        li.className = 'bg-gray-700/50 rounded-lg px-3 py-2 flex items-center justify-between gap-2';

        const left = document.createElement('div');
        const nameEl = document.createElement('div');
        nameEl.className = 'text-sm text-white font-medium';
        nameEl.textContent = entry.exercise;
        const metaEl = document.createElement('div');
        metaEl.className = 'text-xs text-gray-400';
        metaEl.textContent = entry.date + ' · ' + entry.weight + 'kg · ' + entry.duration + '分';
        left.appendChild(nameEl);
        left.appendChild(metaEl);

        const kcalEl = document.createElement('div');
        kcalEl.className = 'text-orange-400 font-bold text-sm flex-shrink-0';
        kcalEl.textContent = entry.kcal.toLocaleString() + ' kcal';

        li.appendChild(left);
        li.appendChild(kcalEl);
        ul.appendChild(li);
      });
    }

    document.getElementById('clearHistoryBtn').addEventListener('click', () => {
      history = [];
      saveHistory();
      renderHistory();
    });

    loadHistory();
    renderHistory();
  </script>
</body>
</html>
